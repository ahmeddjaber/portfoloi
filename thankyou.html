<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Ahmed Djaber</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle Checkbox (hidden) -->
    <input type="checkbox" id="theme-toggle" class="theme-toggle">

    <!-- Main Wrapper -->
    <div class="wrapper">
        <!-- Header -->
        

        <!-- Thank You Section -->
        <main class="main">
            <section class="thankyou">
                <div class="thankyou__bg">
                    <div class="hero__blob hero__blob--1"></div>
                    <div class="hero__blob hero__blob--2"></div>
                </div>
                
                <div class="container thankyou__container">
                    <div class="thankyou__card">
                        <div class="thankyou__icon">✓</div>
                        <h1 class="thankyou__title">Thank You!</h1>
                        <p class="thankyou__message">
                            Your message has been sent successfully. I'll get back to you as soon as possible.
                        </p>
                        <div class="thankyou__divider"></div>
                        <p class="thankyou__submessage">
                            In the meantime, feel free to explore my portfolio or connect with me on social media.
                        </p>
                        <div class="thankyou__buttons">
                            <a href="index.html" class="btn btn--primary">
                                <span class="btn__text">Back to Home</span>
                                <span class="btn__ripple"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        
</body>
</html>
